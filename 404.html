<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found - Kotlin Course Studio</title>
    <link rel="stylesheet" href="/styles.css?v=2" />
    <style>
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .not-found {
        max-width: 560px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .not-found h1 {
        margin: 0 0 10px;
        font-size: 30px;
      }

      .not-found p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.6;
      }

      .not-found a {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        padding: 0 14px;
        border-radius: 8px;
        background: var(--blue);
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <h1>Page not found</h1>
      <p>The course page you opened does not exist. Go back to the course dashboard and continue learning.</p>
      <a href="/">Open course dashboard</a>
    </main>
  </body>
</html>
